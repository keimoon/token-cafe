[package]
name = "token-cafe"
version = "0.1.0"
edition = "2024"
description = "The Claude Code and Codex sessions on this machine as patrons of a JRPG-style night net café, in a desktop window"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
memchr = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
softbuffer = "0.4"
winit = "0.30"

[profile.dev]
opt-level = 1       # the renderer is per-pixel; unoptimized frames are slow

[dev-dependencies]
gif = "0.14.2"
png = "0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSEvent", "NSView", "NSWindow"] }
